name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, pipeline e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Regra ONNX (modelos versionados)
        run: uv run pytest tests/test_project_rules.py

      - name: Pipeline completo (ETL + treino + avaliação)
        run: make all

      - name: Testes
        run: uv run pytest

  frontend:
    name: Front (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Docker (build e smoke test)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t app .

      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app app
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/health | grep -q '"model_loaded":true'
          curl -fs -X POST localhost:8000/api/predict -H 'Content-Type: application/json' \
            -d '{"features": {"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}}'
          curl -fs localhost:8000/ | grep -q '<div id="root">'

      - name: Logs do container
        if: always()
        run: docker logs app || true
