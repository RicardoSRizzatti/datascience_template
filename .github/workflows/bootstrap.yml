# TEMPORÁRIO: gera lockfiles, valida o template e comita os resultados nesta branch.
# Será removido antes do merge na main.
name: bootstrap

on:
  push:
    branches: [bootstrap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Python - lock, sync, format
        run: |
          rm -rf _bootstrap && mkdir -p _bootstrap
          uv --version > _bootstrap/versions.txt
          uv lock 2>&1 | tee _bootstrap/uv-lock.log
          uv sync 2>&1 | tail -40 > _bootstrap/uv-sync.log
          uv run ruff format . > _bootstrap/ruff.log 2>&1 || true
          uv run ruff check --fix . >> _bootstrap/ruff.log 2>&1 && echo "ruff=0" >> _bootstrap/status.txt || echo "ruff=1" >> _bootstrap/status.txt

      - name: Python - pipeline + testes
        run: |
          make all > _bootstrap/pipeline.log 2>&1 && echo "pipeline=0" >> _bootstrap/status.txt || echo "pipeline=1" >> _bootstrap/status.txt
          uv run pytest -v > _bootstrap/pytest.log 2>&1 && echo "pytest=0" >> _bootstrap/status.txt || echo "pytest=1" >> _bootstrap/status.txt
          uv pip list > _bootstrap/pip-list.txt 2>&1 || true

      - name: Front - install + build
        working-directory: app/frontend
        run: |
          node --version >> ../../_bootstrap/versions.txt
          npm install > ../../_bootstrap/npm-install.log 2>&1 && echo "npm_install=0" >> ../../_bootstrap/status.txt || echo "npm_install=1" >> ../../_bootstrap/status.txt
          npm ls --depth=0 >> ../../_bootstrap/versions.txt 2>&1 || true
          npm run build > ../../_bootstrap/front-build.log 2>&1 && echo "front_build=0" >> ../../_bootstrap/status.txt || echo "front_build=1" >> ../../_bootstrap/status.txt

      - name: Docker - build + smoke test
        run: |
          docker build -t app . > _bootstrap/docker-build.log 2>&1 && echo "docker_build=0" >> _bootstrap/status.txt || echo "docker_build=1" >> _bootstrap/status.txt
          docker run -d -p 8000:8000 --name app app >> _bootstrap/docker-smoke.log 2>&1 || true
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          {
            curl -fsS localhost:8000/api/health; echo
            curl -fsS -X POST localhost:8000/api/predict -H 'Content-Type: application/json' \
              -d '{"features": {"sepal_length": 6.5, "sepal_width": 3.0, "petal_length": 5.2, "petal_width": 2.0}}'; echo
            curl -fsS localhost:8000/ | head -c 400; echo
            docker image ls app
            docker inspect --format '{{json .State.Health}}' app
          } >> _bootstrap/docker-smoke.log 2>&1 && echo "docker_smoke=0" >> _bootstrap/status.txt || echo "docker_smoke=1" >> _bootstrap/status.txt
          docker logs app >> _bootstrap/docker-smoke.log 2>&1 || true

      - name: Screenshots do app
        run: |
          cd _bootstrap
          npx -y playwright@1.56.0 install --with-deps chromium > playwright.log 2>&1
          for scheme in light dark; do
            npx -y playwright@1.56.0 screenshot --browser=chromium --color-scheme=$scheme \
              --viewport-size=1280,900 --full-page --wait-for-timeout=4000 \
              http://localhost:8000 app-$scheme.png >> playwright.log 2>&1 || true
          done
          npx -y playwright@1.56.0 screenshot --browser=chromium --viewport-size=390,844 --full-page \
            --wait-for-timeout=4000 http://localhost:8000 app-mobile.png >> playwright.log 2>&1 || true
          ls *.png >> status.txt 2>&1 || echo "screenshots=0 arquivos" >> status.txt

      - name: Comitar resultados na branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!app/frontend/dist' ':!data'
          git add -f _bootstrap
          git commit -m "bootstrap: resultados da execução" || true
          git push
