# TEMPORÁRIO: treina o modelo de exemplo a partir do commit final (branch release-tmp).
name: bootstrap

on:
  push:
    branches: [bootstrap]

permissions:
  contents: write

jobs:
  train-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-tmp
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Treinar e validar
        run: |
          set +e
          uv sync --locked > sync.log 2>&1 || { echo "::error title=sync::$(tail -5 sync.log | tr '\n' '|')"; exit 1; }
          uv run ruff check . > ruff.log 2>&1 && uv run ruff format --check . >> ruff.log 2>&1
          echo "::warning title=ruff::$(tail -3 ruff.log | tr '\n' '|')"
          make all > pipeline.log 2>&1 || { echo "::error title=pipeline::$(tail -8 pipeline.log | tr '\n' '|')"; exit 1; }
          echo "::warning title=pipeline::$(grep -E 'Train:|Evaluate' pipeline.log | tr '\n' '|')"
          uv run pytest -q > pytest.log 2>&1
          echo "::warning title=pytest::$(tail -3 pytest.log | tr '\n' '|')"
          echo "::warning title=status::$(git status --porcelain | tr '\n' '|')"
          echo "::warning title=git::$(python3 -c "import json;print(json.load(open('models/metadata.json'))['git'])")"

      - name: Comitar modelo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add models/model.onnx models/metadata.json
          git commit -m "Modelo de exemplo treinado (Iris)"
          git push origin HEAD:release-tmp
