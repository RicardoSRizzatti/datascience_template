[project]
name = "datascience-template"
version = "0.1.0"
description = "Template de projeto de ciência de dados: ETL, treinamento de modelos (ONNX) e webapp FastAPI + React."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ricardo Scremin Rizzatti" }]
# Dependências compartilhadas por todas as etapas (inclusive a imagem do app).
# Mantenha esta lista mínima: tudo que for específico de uma etapa vai no grupo dela.
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
# Extração, transformação e carga.
etl = [
    "pandas>=2.2",
    "pyarrow>=17.0",
]
# Treinamento e avaliação. skl2onnx/onnx convertem o modelo; onnxruntime avalia o ONNX.
ml = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "skl2onnx>=1.17",
    "onnx>=1.16",
    "onnxruntime>=1.19",
]
# Inferência: é só isto (+ dependências do projeto) que vai para a imagem Docker.
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.19",
]
# Opcional: só para quem publica os dados processados no BigQuery ou no GCS.
gcp = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "db-dtypes>=1.3",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
    "ipykernel>=6.29",
]

[tool.uv]
# `uv sync` instala tudo para desenvolvimento, menos o grupo gcp.
# Para o GCP: `make setup-gcp` (uv sync --group gcp).
default-groups = ["etl", "ml", "app", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "etl", "ml", "app"]
exclude = ["app/frontend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
